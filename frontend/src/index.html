<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Nhân Sự - 237561 - Huỳnh Thị Bé Mị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-light">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'http://localhost:5000/api/employees';

    function App() {
      const [employees, setEmployees] = useState([]);
      const [loading, setLoading] = useState(false);
      const [alert, setAlert] = useState({ show: false, type: '', message: '' });
      const [searchTerm, setSearchTerm] = useState('');
      
      const initialForm = {
        employeeId: '',
        fullName: '',
        email: '',
        gender: 'Nam',
        department: 'IT',
        position: 'Nhân viên',
        phone: '',
        status: 'Đang làm việc'
      };
      
      const [formData, setFormData] = useState(initialForm);
      const [isEditing, setIsEditing] = useState(false);

      const showAlert = (type, message) => {
        setAlert({ show: true, type, message });
        setTimeout(() => setAlert({ show: false, type: '', message: '' }), 4000);
      };

      const fetchEmployees = async (query = '') => {
        setLoading(true);
        try {
          const url = query ? `${API_URL}?search=${encodeURIComponent(query)}` : API_URL;
          const res = await fetch(url);
          if (!res.ok) throw new Error('API Backend gặp lỗi!');
          const data = await res.json();
          setEmployees(data);
        } catch (err) {
          showAlert('danger', 'Lỗi tải dữ liệu: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchEmployees();
      }, []);

      const handleSearch = (e) => {
        e.preventDefault();
        fetchEmployees(searchTerm);
      };

      const handleInputChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.employeeId || !formData.fullName || !formData.email) {
          showAlert('warning', 'Vui lòng điền đầy đủ Mã NV, Họ tên và Email!');
          return;
        }

        try {
          const method = isEditing ? 'PUT' : 'POST';
          const url = isEditing ? `${API_URL}/${formData.employeeId}` : API_URL;
          
          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });

          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Thao tác thất bại');

          showAlert('success', isEditing ? 'Cập nhật nhân viên thành công!' : 'Thêm nhân viên mới thành công!');
          setFormData(initialForm);
          setIsEditing(false);
          fetchEmployees();
        } catch (err) {
          showAlert('danger', 'Lỗi: ' + err.message);
        }
      };

      const handleEdit = (emp) => {
        setFormData(emp);
        setIsEditing(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDelete = async (id, name) => {
        if (window.confirm(`Bạn có chắc chắn muốn xóa nhân viên '${name}' (Mã: ${id}) không?`)) {
          try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Không thể xóa nhân viên');
            showAlert('success', 'Xóa nhân viên thành công!');
            fetchEmployees();
          } catch (err) {
            showAlert('danger', 'Lỗi: ' + err.message);
          }
        }
      };

      const handleCancelEdit = () => {
        setFormData(initialForm);
        setIsEditing(false);
      };

      return (
        <div className="container my-4">
          <header className="text-center mb-4">
            <h2 className="text-primary fw-bold">HỆ THỐNG QUẢN LÝ NHÂN SỰ (REACT SPA)</h2>
            <p className="text-muted">MSSV: 237561 | Họ tên: Huỳnh Thị Bé Mị</p>
          </header>

          {alert.show && (
            <div className={`alert alert-${alert.type} alert-dismissible fade show`} role="alert">
              {alert.message}
            </div>
          )}

          <div className="card p-4 shadow-sm mb-4">
            <h5 className="card-title text-secondary mb-3">
              {isEditing ? '✏️ Cập nhật thông tin nhân viên' : '➕ Thêm nhân viên mới'}
            </h5>
            <form onSubmit={handleSubmit}>
              <div className="row g-3">
                <div className="col-md-3">
                  <label className="form-label">Mã NV (*)</label>
                  <input type="text" name="employeeId" className="form-control" value={formData.employeeId} onChange={handleInputChange} disabled={isEditing} required />
                </div>
                <div className="col-md-3">
                  <label className="form-label">Họ và Tên (*)</label>
                  <input type="text" name="fullName" className="form-control" value={formData.fullName} onChange={handleInputChange} required />
                </div>
                <div className="col-md-3">
                  <label className="form-label">Email (*)</label>
                  <input type="email" name="email" className="form-control" value={formData.email} onChange={handleInputChange} required />
                </div>
                <div className="col-md-3">
                  <label className="form-label">Số điện thoại</label>
                  <input type="text" name="phone" className="form-control" value={formData.phone} onChange={handleInputChange} />
                </div>
                <div className="col-md-3">
                  <label className="form-label">Phòng ban</label>
                  <select name="department" className="form-select" value={formData.department} onChange={handleInputChange}>
                    <option value="IT">Công nghệ thông tin</option>
                    <option value="HR">Nhân sự</option>
                    <option value="Kế toán">Kế toán</option>
                    <option value="Marketing">Marketing</option>
                  </select>
                </div>
                <div className="col-md-3">
                  <label className="form-label">Chức vụ</label>
                  <input type="text" name="position" className="form-control" value={formData.position} onChange={handleInputChange} />
                </div>
                <div className="col-md-3">
                  <label className="form-label">Giới tính</label>
                  <select name="gender" className="form-select" value={formData.gender} onChange={handleInputChange}>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                  </select>
                </div>
                <div className="col-md-3">
                  <label className="form-label">Trạng thái</label>
                  <select name="status" className="form-select" value={formData.status} onChange={handleInputChange}>
                    <option value="Đang làm việc">Đang làm việc</option>
                    <option value="Tạm nghỉ">Tạm nghỉ</option>
                    <option value="Đã nghỉ việc">Đã nghỉ việc</option>
                  </select>
                </div>
              </div>
              <div className="mt-3">
                <button type="submit" className={`btn btn-${isEditing ? 'warning' : 'primary'} me-2`}>
                  {isEditing ? 'Cập nhật' : 'Thêm mới'}
                </button>
                {isEditing && (
                  <button type="button" className="btn btn-secondary" onClick={handleCancelEdit}>Hủy bỏ</button>
                )}
              </div>
            </form>
          </div>

          <div className="card p-3 shadow-sm mb-4">
            <form onSubmit={handleSearch} className="row g-2">
              <div className="col-md-10">
                <input type="text" className="form-control" placeholder="Tìm kiếm theo mã nhân viên hoặc họ tên..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              </div>
              <div className="col-md-2">
                <button type="submit" className="btn btn-outline-primary w-100">Tìm kiếm</button>
              </div>
            </form>
          </div>

          <div className="card p-3 shadow-sm">
            <h5 className="card-title text-secondary mb-3">Danh sách nhân viên</h5>
            {loading ? (
              <div className="text-center py-4"><div className="spinner-border text-primary" role="status"></div><p className="mt-2">Đang tải dữ liệu...</p></div>
            ) : (
              <div className="table-responsive">
                <table className="table table-hover align-middle">
                  <thead className="table-dark">
                    <tr>
                      <th>Mã NV</th>
                      <th>Họ và Tên</th>
                      <th>Phòng ban</th>
                      <th>Chức vụ</th>
                      <th>Email</th>
                      <th>Số điện thoại</th>
                      <th>Trạng thái</th>
                      <th className="text-center">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    {employees.length === 0 ? (
                      <tr><td colSpan="8" className="text-center text-muted">Không có dữ liệu nhân viên</td></tr>
                    ) : (
                      employees.map(emp => (
                        <tr key={emp._id || emp.employeeId}>
                          <td className="fw-bold">{emp.employeeId}</td>
                          <td>{emp.fullName}</td>
                          <td>{emp.department || 'N/A'}</td>
                          <td>{emp.position || 'N/A'}</td>
                          <td>{emp.email}</td>
                          <td>{emp.phone || 'N/A'}</td>
                          <td>
                            <span className={`badge bg-${emp.status === 'Đang làm việc' ? 'success' : 'secondary'}`}>
                              {emp.status || 'Đang làm việc'}
                            </span>
                          </td>
                          <td className="text-center">
                            <button className="btn btn-sm btn-outline-warning me-2" onClick={() => handleEdit(emp)}>Xem/Sửa</button>
                            <button className="btn btn-sm btn-outline-danger" onClick={() => handleDelete(emp.employeeId || emp._id, emp.fullName)}>Xóa</button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
